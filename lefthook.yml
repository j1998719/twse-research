pre-push:
  parallel: true
  commands:
    ruff-lint:
      run: .venv/bin/ruff check .
    ruff-format:
      run: .venv/bin/ruff format --check .
    mypy:
      run: .venv/bin/mypy src
    pytest:
      run: .venv/bin/pytest -q
    vulture:
      run: .venv/bin/vulture
    mdformat:
      run: .venv/bin/mdformat --check .
