pre-push:
  parallel: true
  # gh-pages 只有建好的網頁,沒有原始碼可以檢查(publish_pages.sh)
  skip:
    - ref: gh-pages
  commands:
    pyver:
      run: make pyver
    ruff-lint:
      run: .venv/bin/ruff check .
    ruff-format:
      run: .venv/bin/ruff format --check .
    mypy:
      run: .venv/bin/mypy src
    pytest:
      run: .venv/bin/pytest -q
    vulture:
      run: .venv/bin/vulture
    mdformat:
      run: .venv/bin/mdformat --check *.md
    biome:
      run: PATH="$HOME/.nvm/versions/node/v22.23.2/bin:$PATH" npx biome check .
    tsc:
      run: PATH="$HOME/.nvm/versions/node/v22.23.2/bin:$PATH" npx tsc --noEmit
